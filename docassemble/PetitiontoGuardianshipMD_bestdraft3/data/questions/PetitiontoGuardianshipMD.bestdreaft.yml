id: Proceedings Information
question: |
  Other court cases
subquestion: |
  List all other court cases about the child or children, including juvenile court, and all cases involving the petitioner or prospective guardian in any court. Write "None" if there are none.
fields:
  - "Cases about the child or children": proceedings_minor1
    input type: area
  - "Cases involving the petitioner or prospective guardian": proceedings_petitioner1
    input type: area
---
########## Interested persons (Paragraph 8) ##########
code: |
  parents_built_from_children = True
  parents.clear()
  seen_parent_names = []
  for child in children:
    for nm in [child.parent1_name, child.parent2_name if hasattr(child, 'parent2_name') else '']:
      nm = nm.strip()
      if nm and nm.lower() not in seen_parent_names:
        seen_parent_names.append(nm.lower())
        p = parents.appendObject()
        p.name.first = nm
        if petitioner_role == 'parent' and nm.lower() == users[0].name_full().strip().lower():
          p.address = users[0].address
          p.phone_number = users[0].phone_number
          p.email = users[0].email
  parents.gathered = True
