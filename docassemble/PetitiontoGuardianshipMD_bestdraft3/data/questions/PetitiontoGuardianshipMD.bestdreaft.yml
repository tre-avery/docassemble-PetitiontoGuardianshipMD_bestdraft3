id: Trial Court Information
question: |
  Trial Court Information
fields:
  - "Trial court circuit": trial_court_circuit_yes
    datatype: yesno
  - "Trial court orphans": trial_court_orphans_yes
    datatype: yesno
---
# FIX: collects the court name and an address OBJECT. This satisfies the
# `need:` list in AssemblyLine's `trial_court` block
# (trial_court_name and trial_court_address.address).
id: trial court name and address
question: |
  Which court are you filing in?
fields:
  - "Court name": trial_court_name
  - code: |
      trial_court_address.address_fields(
