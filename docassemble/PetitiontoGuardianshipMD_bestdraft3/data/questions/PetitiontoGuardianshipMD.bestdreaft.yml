id: Labeled labeled ccgn001 with fields with fields intro
continue button field: labeled_labeled_ccgn001withfieldswithfields_intro
question: |
  Labeled labeled ccgn001-with-fields-with-fields
subquestion: |
  ### Before you start
  - Gather all needed information about the minor and your connection to them.
  - Have any required documents, like birth certificates, ready to include.

  ### When you are done
  - Check your petition for accuracy and completeness.
  - Send the petition to the right court along with any required fees.

  You can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are siblings.
