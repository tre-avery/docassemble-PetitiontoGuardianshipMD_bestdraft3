id: other interested people
question: |
  Does any of the following apply to the child or children?
subquestion: |
  Check all that apply. We will ask for their details next.
fields:
  - no label: other_interested
    datatype: checkboxes
    choices:
      - A guardian who has already been appointed: guardians
      - Someone holding a power of attorney for the child: power_of_attorney
      - An attorney for the child: minor_attorney
      - Someone else who has taken responsibility for the child: responsible_person
      - A government agency paying benefits for the child: government_agency
      - Someone with an interest in the child's property: interested_person
      - Someone else who controls the child or the child's property: control_person
      - A person or agency eligible to be guardian of the child: eligible_guardian
      - Other heirs at law: heirs
    none of the above: None of these apply
