id: labeled labeled ccgn001withfieldswithfields review screen
event: review_labeled_labeled_ccgn001withfieldswithfields
question: |
  Review your answers
review:
  - Edit: filer_is_adult
    button: |
      **18 or older**

      ${ word(yesno(filer_is_adult)) if defined('filer_is_adult') else '' }
  - Edit: petitioner_role
    button: |
      **Who is filing**

      ${ petitioner_role }
  - Edit: attorneys.revisit
    show if: petitioner_role == 'attorney'
    button: |
      **Attorney**

      % for item in attorneys:
        * ${ item }
      % endfor
  - Edit: users.revisit
    button: |
      **Petitioner**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: court_type
    button: |
      **Court**

      ${ court_display_name if defined('court_display_name') else '' }
  - Edit: filing_county
    button: |
      **County**

      ${ showifdef('filing_county') }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor
  - Edit: petitioner_rel
    button: |
      **Relationship to the children**

      ${ showifdef('petitioner_rel') }
  - Edit: users1_conviction
    show if: defined('users1_conviction')
    button: |
      **Petitioner's criminal history**

      Convicted: ${ word(yesno(users1_conviction)) }
  - Edit: prospective_guardian_person_conviction
    show if: defined('prospective_guardian_person_conviction')
    button: |
      **Prospective guardian's criminal history**

      Convicted: ${ word(yesno(prospective_guardian_person_conviction)) }
  - Edit: children_va_beneficiary
    button: |
      **Veterans Affairs benefits**

      ${ word(yesno(children_va_beneficiary)) if defined('children_va_beneficiary') else '' }
  - Edit: guardianship_reason
    button: |
      **Reason for guardianship**

      ${ showifdef('guardianship_reason') }
  - Edit: siblings.revisit
    show if: defined('siblings.there_are_any') and siblings.there_are_any
    button: |
      **Siblings**

      % for item in siblings:
        * ${ item }
      % endfor
  - Edit: other_interested
    button: |
      **Other interested people**

      Edit the list of people and their details.
  - Edit: residences.revisit
    button: |
      **Where the child has lived**

      % for item in residences:
        * ${ item.person_name }
      % endfor
  - Edit: proceedings_minor1
    button: |
      **Other court cases**

      ${ showifdef('proceedings_minor1') }

      ${ showifdef('proceedings_petitioner1') }
