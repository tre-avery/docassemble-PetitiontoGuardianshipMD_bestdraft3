#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_labeled_labeled_ccgn001withfieldswithfields
mandatory: True
code: |
  al_intro_screen
  labeled_labeled_ccgn001withfieldswithfields_intro

  user_role = "plaintiff"
  user_ask_role = "plaintiff"

  # 1. Petitioner & Court Information
  nav.set_section("about_you")
  users.gather()
  set_parts(subtitle=str(users))

  nav.set_section("case_details")
  trial_court_circuit_yes
  trial_court_orphans_yes
  trial_court
  docket_number
  docket_number_2

  # 2. Guardianship Type & Reason
  guardianship_person_yes
  guardianship_property_yes
  guardianship_person_property_yes
  guardianship_reason

  # 3. Children / Minors
  nav.set_section("people")
  children.gather()
  children_current_location
  children_va_beneficiary

  # 4. Petitioner & Prospective Guardian Background
  users1_conviction
  if users1_conviction:
    users1_conviction_name
    users1_conviction_year
    users1_conviction_court
    users1_good_cause

  prospective_guardian_person.gather()
  if prospective_guardian_person.number() > 0:
    prospective_guardian_person_rel
    prospective_guardian_person_conviction
    if prospective_guardian_person_conviction:
      prospective_guardian_person_conviction_name
      prospective_guardian_person_conviction_year
      prospective_guardian_person_conviction_court
      prospective_guardian_person_good_cause

  # Prospective guardian of the minor's property (only if property guardianship is requested)
  if guardianship_property_yes or guardianship_person_property_yes:
    prospective_guardian_property_name
    prospective_guardian_property_age
    prospective_guardian_property_rel
    prospective_guardian_property_conviction
    if prospective_guardian_property_conviction:
      prospective_guardian_property_conviction_name
      prospective_guardian_property_conviction_year
      prospective_guardian_property_conviction_court
      prospective_guardian_property_good_cause

  # 5. Interested Parties & Lists
  parents.gather()
  siblings.gather()
  guardians.gather()
  power_of_attorney.gather()
  minor_attorney.gather()
  responsible_person.gather()
  government_agency.gather()
  interested_person.gather()
  control_person.gather()
  eligible_guardian.gather()

  # 6. Residences & Property Details
  residences.gather()
  properties.gather()
  users1_interest_in_property

  # 7. Proceedings & Signatures
  proceedings_minor1
  proceedings_petitioner1

  nav.set_section("sign_and_submit")
  signature_date
  users1_signed_date
  attorney_signed_date

  labeled_labeled_ccgn001withfieldswithfields_preview_question
  basic_questions_signature_flow

  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  set_progress(100)
  labeled_labeled_ccgn001withfieldswithfields_download
