  description: |-
    This form is used to ask for guardianship of a minor in Maryland. It lets you request the right to make decisions for a minor child.
  can_I_use_this_form: |
    You can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are siblings.
