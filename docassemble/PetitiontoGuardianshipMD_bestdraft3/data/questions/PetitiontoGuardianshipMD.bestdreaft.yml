---
#################### Interview order #####################
id: interview_order_labeled_labeled_ccgn001withfieldswithfields
mandatory: True
code: |
  al_intro_screen                                         # intro screen 1
  labeled_labeled_ccgn001withfieldswithfields_intro       # intro screen 2

  user_role = "plaintiff"
  user_ask_role = "plaintiff"

  nav.set_section("about_you")

  # Age check: anyone under 18 is stopped before the role question
  filer_is_adult
  if not filer_is_adult:
    under_18_blocker

  # Who is filling this out? Decides the rest of the flow.
  petitioner_role

  # Attorneys give their own details first; the petitioner is then the client.
  if petitioner_role == 'attorney':
    attorneys.gather()
    attorney_number
    attorney_fax

  # Petitioner: name, then address, then the rest
  users.gather()
  users[0].address.address
  users[0].phone_number
  users[0].email
  users[0].birthdate
  users1_fax
  set_parts(subtitle=str(users))

  # Court: one county choice fills in everything it can
  nav.set_section("case_details")
  court_type
  filing_county
  trial_court_name = court_display_name
  trial_court_address.county = filing_county
  if filing_county in md_court_info:
    trial_court_address.address = md_court_info[filing_county].get('address', '')
    trial_court_address.unit = ""
    trial_court_address.city = md_court_info[filing_county].get('city', '')
    trial_court_address.state = "MD"
    trial_court_address.zip = md_court_info[filing_county].get('zip', '')
    trial_court_address.country = "US"
  else:
    trial_court_address.address     # fallback: asks the user for the court address
  trial_court
  if filing_county in md_court_info:
    trial_court.phone_number = md_court_info[filing_county].get('phone', '')
  else:
    trial_court.phone_number
  # Children: name, birthdate, gender, parents, home, guardian
  nav.set_section("people")
  children.gather()
  children_current_location

  # Paragraph 3
  if petitioner_role == 'parent':
    petitioner_rel = 'Parent'
  else:
    petitioner_rel

  # Paragraph 5: only if the petitioner is a guardian
  if petitioner_is_guardian:
    users1_conviction
    if users1_conviction:
      users1_conviction_name
      users1_conviction_year
      users1_conviction_court
      users1_good_cause

  # Paragraph 6a: only if someone else is a guardian
  if need_other_guardian:
    prospective_guardian_person_conviction
    if prospective_guardian_person_conviction:
      prospective_guardian_person_conviction_name
      prospective_guardian_person_conviction_year
      prospective_guardian_person_conviction_court
      prospective_guardian_person_good_cause

  children_va_beneficiary
  guardianship_reason

  # Interested persons (Paragraph 8)
  parents_built_from_children
  for parent in parents:
    parent.address.address
    parent.phone_number
    parent.email
  siblings.gather()
  other_interested
  if other_interested['guardians']:
    guardians.gather()
  if other_interested['power_of_attorney']:
    power_of_attorney.gather()
  if other_interested['minor_attorney']:
    minor_attorney.gather()
  if other_interested['responsible_person']:
    responsible_person.gather()
  if other_interested['government_agency']:
    government_agency.gather()
  if other_interested['interested_person']:
    interested_person.gather()
  if other_interested['control_person']:
    control_person.gather()
  if other_interested['eligible_guardian']:
    eligible_guardian.gather()
  if other_interested['heirs']:
    heirs.gather()

  # Paragraph 9 and 13
  residences.gather()
  proceedings_minor1
  proceedings_petitioner1

  nav.set_section("sign_and_submit")
  signature_date

  labeled_labeled_ccgn001withfieldswithfields_preview_question
  basic_questions_signature_flow

  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  set_progress(100)
  labeled_labeled_ccgn001withfieldswithfields_download
---
id: Labeled labeled ccgn001 with fields with fields intro
continue button field: labeled_labeled_ccgn001withfieldswithfields_intro
question: |2
  Maryland Petition for Guardianship of Minor
subquestion: |
  ### Before you start
  - Gather all needed information about the minor and your connection to them.
  - Have any required documents, like birth certificates, ready to include.

  ### When you are done
  - Check your petition for accuracy and completeness.
  - Send the petition to the right court along with any required fees.

  You can use this form if you are seeking guardianship of a minor child. If the minor is not a child, a different form is needed. Make sure to fill out separate petitions for each minor unless they are full siblings in the same situation. Half-siblings need separate petitions.

  This petition asks the court to appoint a guardian of the **person** of a minor. It does not ask for guardianship of the minor’s property.
---
########## Who is filing ##########
id: filer is adult
question: |
  Are you 18 years of age or older?
fields:
  - no label: filer_is_adult
    datatype: yesnoradio
---
id: under 18 blocker
event: under_18_blocker
question: |
  You must be 18 or older to use this form
subquestion: |
  Because you answered that you are under 18, you can't file a petition for guardianship of a minor with this form.

  If you are under 18 and need help with a guardianship or custody situation, you can ask a trusted adult to help you, or contact [Maryland Legal Aid](https://www.mdlab.org) for free legal help.

  If you answered by mistake, you can go back and change your answer.
buttons:
  - Exit: exit
    url: https://www.mdlab.org
---
id: petitioner role
question: |
  Who is filling out this petition?
fields:
  - no label: petitioner_role
    datatype: radio
    choices:
      - I am an attorney filing for a client: attorney
      - I am a parent of the child: parent
      - I want to be appointed guardian: prospective guardian
---
code: |
  petitioner_label = "My client is" if petitioner_role == 'attorney' else "I am"
---
id: attorney details
question: |
  Your attorney details
fields:
  - Attorney number: attorney_number
  - Fax number: attorney_fax
    required: False
---
id: petitioner fax
question: |
  Fax number
subquestion: |
  Skip this if there isn't one.
fields:
  - Fax number: users1_fax
    required: False
---
code: |
  users1_signed_date = signature_date
  attorney_signed_date = signature_date
---
code: |
  users1_address_city_zip = users[0].address.line_two()
---
code: |
  attorney_address_city_zip = attorneys[0].address.line_two()
---
code: |
  signature_fields = ['attorneys[0].signature'] if petitioner_role == 'attorney' else ['users[0].signature']
---
id: signature date
question: |
  Date of signing
fields:
  - "Signature date": signature_date
    datatype: date
    default: ${ today() }
---
########## Court ##########
id: court type
question: |
  Which kind of court are you filing in?
fields:
  - no label: court_type
    datatype: radio
    choices:
      - Circuit Court: circuit
      - Orphans' Court: orphans
---
code: |
  trial_court_circuit_yes = (court_type == 'circuit')
  trial_court_orphans_yes = (court_type == 'orphans')
---
code: |
  md_counties = [
    "Allegany", "Anne Arundel", "Baltimore City", "Baltimore County",
    "Calvert", "Caroline", "Carroll", "Cecil", "Charles", "Dorchester",
    "Frederick", "Garrett", "Harford", "Howard", "Kent", "Montgomery",
    "Prince George's", "Queen Anne's", "St. Mary's", "Somerset", "Talbot",
    "Washington", "Wicomico", "Worcester",
  ]
---
id: filing county
question: |
  Which county are you filing in?
subquestion: |
  If you are filing in Baltimore City, choose Baltimore City.
fields:
  - County: filing_county
    datatype: dropdown
    code: md_counties
---
code: |
  if filing_county == "Baltimore City":
    court_place = "Baltimore City"
  else:
    court_place = filing_county + " County"
  court_display_name = ("Circuit Court for " if court_type == 'circuit' else "Orphans' Court for ") + court_place
---
comment: |
  FILL THIS IN from the Maryland Judiciary court directory, using checked
  values only. A county that is missing here falls back to asking the user
  for the court address and phone, so you can add counties a few at a time.
  Example entry (not real):
    "Example County": {"address": "1 Main St", "city": "Townsville", "zip": "21000", "phone": "410-555-0100"},
code: |
  md_court_info = {
  }
---
id: trial court name and address
question: |
  What is the court's address?
fields:
  - code: |
      trial_court_address.address_fields(
          country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE
      )
---
id: trial court phone number
question: |
  What is the court's phone number?
fields:
  - "Phone number": trial_court.phone_number
    required: False
---
code: |
  # Guardianship is fixed to guardianship of the person
  guardianship_person_yes = True
  guardianship_property_yes = False
  guardianship_person_property_yes = False
---
########## Children ##########
id: child is complete
code: |
  children[i].name.first
  children[i].birthdate
  children[i].gender
  children[i].parent1_name
  children[i].address.address
  children[i].lives_in_filing_county
  if not children[i].lives_in_filing_county:
    children[i].location_in_county
  if petitioner_role == 'prospective guardian':
    children[i].guardian_is_petitioner = True
  elif petitioner_role == 'parent':
    children[i].guardian_is_petitioner = False
  else:
    children[i].guardian_is_petitioner     # attorney: asked per child
  if not children[i].guardian_is_petitioner:
    if not hasattr(children[i], 'prospective_guardian'):
      children[i].initializeAttribute('prospective_guardian', ALIndividual)
    children[i].prospective_guardian.name.first
    children[i].prospective_guardian.age_stated
    children[i].prospective_guardian_rel
  children[i].complete = True
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: child birthdate
question: |
  When was ${ children[i] } born?
fields:
  - Birthdate: children[i].birthdate
    datatype: date
    max: ${ today() }
---
id: child gender
sets:
  - children[i].gender
question: |
  What is ${ children[i].possessive('gender') }?
fields:
  - code: |
      children[i].gender_fields(show_help=True)
---
id: child parents
question: |
  Who are ${ children[i].possessive('parents') }?
subquestion: |
  Enter the legal parents' full names. Leave the second blank if there is only one known parent.
fields:
  - First parent's full name: children[i].parent1_name
    default: ${ users[0].name_full() if petitioner_role == 'parent' and defined('users[0].name.first') else '' }
  - Second parent's full name: children[i].parent2_name
    required: False
---
id: child home address
question: |
  Where does ${ children[i] } live?
fields:
  - code: |
      children[i].address_fields(
          country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE
      )
---
id: child county
question: |
  Does ${ children[i] } live in ${ court_place }?
fields:
  - no label: children[i].lives_in_filing_county
    datatype: yesnoradio
  - Where in ${ court_place } is ${ children[i] } staying now?: children[i].location_in_county
    show if:
      variable: children[i].lives_in_filing_county
      is: False
---
id: child guardian
question: |
  Who is asking to be ${ children[i].possessive('guardian') }?
fields:
  - no label: children[i].guardian_is_petitioner
    datatype: radio
    choices:
      code: |
        [[petitioner_label, True], ["Someone else", False]]
---
id: child other guardian
sets:
  - children[i].prospective_guardian.name.first
  - children[i].prospective_guardian.name.last
  - children[i].prospective_guardian.name.middle
  - children[i].prospective_guardian.name.suffix
  - children[i].prospective_guardian.age_stated
  - children[i].prospective_guardian_rel
question: |
  Who is the prospective guardian of ${ children[i] }?
fields:
  - code: |
      children[i].prospective_guardian.name_fields()
  - Their age: children[i].prospective_guardian.age_stated
    datatype: integer
    min: 18
  - Their relationship to ${ children[i] }: children[i].prospective_guardian_rel
---
id: another child
question: |
  Is there another child on this petition?
subquestion: |
  A single petition can cover full siblings in the same situation. Half-siblings, and children who are not in the same situation, need separate petitions.

  % if len(children) >= 6:
  This petition has room for six children, so you can't add more. If there are other children, start a separate petition for them.
  % endif
fields:
  - no label: children.there_is_another
    datatype: yesnoradio
  - Is the next child a full sibling of the children already listed, in the same situation?: children_next_is_full_sibling
    datatype: yesnoradio
    show if:
      variable: children.there_is_another
      is: True
validation code: |
  if children.there_is_another and len(children) >= 6:
    validation_error(
        "This petition has room for six children. Choose No to finish this petition, "
        "then start a separate petition for any other children.",
        field="children.there_is_another",
    )
  if children.there_is_another and not children_next_is_full_sibling:
    validation_error(
        "Half-siblings, and children who are not in the same situation, need their own petition. "
        "Choose No above to finish this petition, then start a new petition for the other child.",
        field="children_next_is_full_sibling",
    )
---
code: |
  children_current_location = "; ".join(
      [str(c) + ": " + c.location_in_county for c in children if not c.lives_in_filing_county]
  )
---
code: |
  petitioner_is_guardian = any([c.guardian_is_petitioner for c in children])
---
code: |
  other_guardian_child = next((c for c in children if not c.guardian_is_petitioner), None)
  need_other_guardian = other_guardian_child is not None
---
code: |
  prospective_guardian_person_rel = other_guardian_child.prospective_guardian_rel
---
########## Paragraphs 3-6, 10, 13 ##########
